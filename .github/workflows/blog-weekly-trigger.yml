name: Blog weekly draft generation

on:
  schedule:
    # Chaque lundi ~07:00 UTC (~08:00/09:00 heure de Paris selon la saison —
    # GitHub Actions ne gère que l'UTC, cf. issue de suivi sur la dérive DST).
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    # Tant que BLOG_CRON_SECRET n'est pas configuré côté repo, le job se
    # contente de ne rien faire plutôt que d'échouer bruyamment (401) à
    # chaque déclenchement hebdomadaire.
    if: ${{ secrets.BLOG_CRON_SECRET != '' }}
    steps:
      - name: Réveiller /api/blog/generate
        run: |
          curl --fail-with-body -sS -X POST \
            --max-time 30 --retry 3 --retry-delay 5 \
            "https://elancestvous.fr/api/blog/generate" \
            -H "Authorization: Bearer ${{ secrets.BLOG_CRON_SECRET }}"
