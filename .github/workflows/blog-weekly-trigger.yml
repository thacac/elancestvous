name: Blog weekly draft generation

on:
  schedule:
    # Chaque lundi ~07:00 UTC (~08:00/09:00 heure de Paris selon la saison —
    # GitHub Actions ne gère que l'UTC, cf. issue de suivi sur la dérive DST).
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Réveiller /api/blog/generate
        # Le contexte `secrets` n'est pas une "named-value" reconnue dans une
        # expression `if:` (ni au niveau job, ni au niveau step) — GitHub
        # Actions refuse alors de parser le workflow entier (erreur "failed
        # to parse workflow" à l'exécution, 0 job, conclusion "failure" sur
        # CHAQUE push du repo, pas seulement sur ce workflow). La présence de
        # BLOG_CRON_SECRET doit donc être testée en shell, dans `run:`, via
        # une variable d'env — jamais dans `if:`.
        env:
          BLOG_CRON_SECRET: ${{ secrets.BLOG_CRON_SECRET }}
        run: |
          if [ -z "$BLOG_CRON_SECRET" ]; then
            echo "BLOG_CRON_SECRET n'est pas configuré — rien à faire."
            exit 0
          fi
          curl --fail-with-body -sS -X POST \
            --max-time 30 --retry 3 --retry-delay 5 \
            "https://elancestvous.fr/api/blog/generate" \
            -H "Authorization: Bearer $BLOG_CRON_SECRET"
