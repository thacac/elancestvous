name: Blog weekly draft generation

on:
  schedule:
    # Chaque lundi ~07:00 UTC (~08:00/09:00 heure de Paris selon la saison —
    # GitHub Actions ne gère que l'UTC, cf. issue de suivi sur la dérive DST).
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Réveiller /api/blog/generate
        run: |
          curl --fail-with-body -sS -X POST \
            "https://elancestvous.fr/api/blog/generate" \
            -H "Authorization: Bearer ${{ secrets.BLOG_CRON_SECRET }}"
