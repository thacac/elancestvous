name: Blog veille daily scan

on:
  schedule:
    # Chaque jour ~06:00 UTC, avant la génération hebdomadaire du lundi
    # (blog-weekly-trigger.yml, ~07:00 UTC) — indépendant d'elle : ce scan ne
    # fait que proposer une actualité sur Discord si la recherche Claude en
    # trouve une, il ne génère jamais rien lui-même (cf.
    # services/blog/generateDraft.ts::runVeilleScan). Contrairement au cron
    # hebdomadaire, /api/blog/veille est idempotent (aucune génération
    # déclenchée), donc pas besoin du même luxe de prudence sur les retries —
    # on n'en ajoute simplement pas, faute de besoin, pas par prudence.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Réveiller /api/blog/veille
        # Même garde que blog-weekly-trigger.yml : BLOG_CRON_SECRET testé en
        # shell dans `run:`, jamais dans `if:` (cf. son commentaire détaillé).
        env:
          BLOG_CRON_SECRET: ${{ secrets.BLOG_CRON_SECRET }}
        run: |
          if [ -z "$BLOG_CRON_SECRET" ]; then
            echo "BLOG_CRON_SECRET n'est pas configuré — rien à faire."
            exit 0
          fi
          # --max-time 180 : hérité de l'ancien mécanisme web_search (pensée
          # adaptative, relances sur pause_turn), qui causait en prod un échec
          # systématique "curl: (28) ... 0 bytes received" avec un délai plus
          # court. Ce mécanisme a été remplacé par du RSS/Atom (chaque source
          # a son propre timeout de 10s, cf. FETCH_TIMEOUT_MS dans
          # rssFeedFetcher.ts, récupérées en parallèle via Promise.allSettled)
          # suivi d'un seul appel Haiku sans outil (actualiteWatch.ts) — délai
          # gardé large faute de mesure réelle en prod sur ce nouveau chemin,
          # plutôt que de reproduire la même erreur ("trop court") pour une
          # raison différente. À resserrer une fois des données de prod
          # disponibles. Toujours pas de --retry : ce scan est idempotent
          # (aucune génération déclenchée) mais une actualité trouvée est
          # immédiatement mise en file et exclue des recherches futures (cf.
          # commentaire sur alreadyProposedUrls dans generateDraft.ts) — un
          # retry pendant que le premier appel tourne encore doublerait juste
          # l'appel Claude pour rien, sans risque de double proposition.
          curl --fail-with-body -sS -X POST \
            --max-time 180 \
            "https://elancestvous.fr/api/blog/veille" \
            -H "Authorization: Bearer $BLOG_CRON_SECRET"
