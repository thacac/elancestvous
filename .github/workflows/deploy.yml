name: Build and Deploy

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/elancestvous-nextjs-16
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  
  deploy:
    needs: build
    # Une pull request vers master ne doit jamais toucher au VPS de prod —
    # seul un push réel sur master (merge) ou un déclenchement manuel le
    # fait. `build` continue de tourner sur les PR (vérifie que l'image
    # Docker se construit), seul `deploy` est sauté.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env file from GitHub Secrets
        run: |
          echo "SMTP_HOST=${{ secrets.SMTP_HOST }}" >> .env
          echo "SMTP_PORT=${{ secrets.SMTP_PORT }}" >> .env
          echo "SMTP_USR=${{ secrets.SMTP_USR }}" >> .env
          echo "SMTP_PWD=${{ secrets.SMTP_PWD }}" >> .env
          echo "BLOG_ENABLED=${{ secrets.BLOG_ENABLED }}" >> .env
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> .env
          echo "IMAGE_GEN_API_KEY=${{ secrets.IMAGE_GEN_API_KEY }}" >> .env
          echo "GITHUB_BLOG_PAT=${{ secrets.GITHUB_BLOG_PAT }}" >> .env
          echo "GITHUB_REPO=${{ github.repository }}" >> .env
          echo "BLOG_CRON_SECRET=${{ secrets.BLOG_CRON_SECRET }}" >> .env
          echo "DISCORD_BOT_TOKEN=${{ secrets.DISCORD_BOT_TOKEN }}" >> .env
          echo "DISCORD_PUBLIC_KEY=${{ secrets.DISCORD_PUBLIC_KEY }}" >> .env
          echo "DISCORD_CHANNEL_ID=${{ secrets.DISCORD_CHANNEL_ID }}" >> .env
          echo "BLOG_REVIEW_SECRET=${{ secrets.BLOG_REVIEW_SECRET }}" >> .env

      - name: Prepare deployment folder on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USR }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            # Create the deployment directory if it doesn't exist
            mkdir -p /home/${{ secrets.VPS_USR }}/elancestvous

            # Set the owner of the directory to the deployment user
            chown ${{ secrets.VPS_USR }}:${{ secrets.VPS_USR }} /home/${{ secrets.VPS_USR }}/elancestvous

            # Restrict permissions so only the user can access the directory
            chmod 700 /home/${{ secrets.VPS_USR }}/elancestvous

      - name: Copy files to VPS (Docker Compose, .env)
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USR }}
          password: ${{ secrets.VPS_PASSWORD }} # Ou key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yaml,infra/deploy.sh,.env"
          target: "/home/${{ secrets.VPS_USR }}/elancestvous/"
          strip_components: 0 # Garde la structure des dossiers si besoin (infra dossier etc.)

      - name: Run deployment script
        uses: appleboy/ssh-action@v1.2.0
        env:
          VPS_USR: ${{ secrets.VPS_USR }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USR }}
          password: ${{ secrets.VPS_PASSWORD }}
          envs: GITHUB_ACTOR,GITHUB_TOKEN,VPS_USR
          script: |
            cd /home/${{ secrets.VPS_USR }}/elancestvous
            echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
            docker compose up -d --pull always
