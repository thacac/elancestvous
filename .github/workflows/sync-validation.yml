name: Sync validation with master

# Ramène sur `validation` tout ce qui arrive sur master : merges de
# promotion et contenu blog automatisé écrit directement sur master
# (publication approuvée sur Discord, file d'actualités, rapport SEO — tous
# poussés avec GH_PAT_TOKEN, un push fait avec le GITHUB_TOKEN d'un run ne
# déclenchant aucun workflow). La Val reste ainsi à jour.
#
# GH_PAT_TOKEN doit avoir le droit "Workflows" (écriture) : sans lui, GitHub
# refuse le push dès que master apporte une modification de .github/workflows.
#
# En cas de conflit, le job échoue (notification GitHub) sans rien pousser :
# résoudre à la main en mergeant master dans validation.

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: sync-validation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation
        uses: actions/checkout@v4
        with:
          ref: validation
          fetch-depth: 0
          # GH_PAT_TOKEN et non le GITHUB_TOKEN du run : un push fait avec
          # ce dernier ne déclenche aucun autre workflow, la Val ne serait
          # donc pas redéployée (deploy-validation.yml).
          token: ${{ secrets.GH_PAT_TOKEN }}

      - name: Merger master dans validation
        # Jusqu'à 3 tentatives : si une PR de feature est mergée dans
        # validation entre le fetch et le push, le push est refusé
        # (non fast-forward) — on repart du nouvel état de validation. Sans
        # risque ici (merge idempotent, rien à voir avec /api/blog/generate).
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin master validation
            git reset --keep origin/validation
            if git merge-base --is-ancestor origin/master HEAD; then
              echo "validation contient déjà master — rien à faire."
              exit 0
            fi
            if ! git merge --no-edit origin/master; then
              git merge --abort
              echo "::error::Conflit entre master et validation — merger master dans validation à la main."
              exit 1
            fi
            if git push origin HEAD:validation; then
              exit 0
            fi
            echo "Push refusé (validation a bougé), nouvelle tentative ($attempt/3)..."
            sleep 5
          done
          echo "::error::validation n'a pas pu être synchronisée après 3 tentatives."
          exit 1
