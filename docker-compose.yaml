services:
  elancestvous:
    image: ghcr.io/thacac/elancestvous-nextjs-16:latest
    container_name: elancestvous
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.elancestvous.rule=Host(`elancestvous.fr`)
      - traefik.http.routers.elancestvous.entrypoints=websecure
      - traefik.http.routers.elancestvous.tls=true
      - traefik.http.routers.elancestvous.tls.certresolver=letsencrypt
      - traefik.http.services.elancestvous.loadbalancer.server.port=3000
      - traefik.http.routers.elancestvous-www.rule=Host(`www.elancestvous.fr`)
      - traefik.http.routers.elancestvous-www.entrypoints=websecure
      - traefik.http.routers.elancestvous-www.tls=true
      - traefik.http.routers.elancestvous-www.tls.certresolver=letsencrypt
      - traefik.http.routers.elancestvous-www.middlewares=www-to-apex
      - traefik.http.middlewares.www-to-apex.redirectregex.regex=^https?://www\\.elancestvous\\.fr/(.*)
      - traefik.http.middlewares.www-to-apex.redirectregex.replacement=https://elancestvous.fr/$${1}
      - traefik.http.middlewares.www-to-apex.redirectregex.permanent=true
